<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAM OFC - Vercel Mail</title>
    <style>
        body { background: #0a0a0c; color: #00ff41; font-family: monospace; padding: 20px; }
        .box { border: 1px solid #00ff41; padding: 15px; border-radius: 5px; margin-bottom: 20px; background: #000; }
        .msg { border-bottom: 1px dashed #00ff41; padding: 10px 0; }
        .otp { color: #fff; background: #d400ff; padding: 2px 5px; font-weight: bold; }
        h2 { color: #38bdf8; }
    </style>
</head>
<body>
    <h2>[ FAM OFC - CLOUD MONITOR ]</h2>
    <div class="box">
        <strong>YOUR EMAIL:</strong> <br>
        <span id="mail">Loading...</span>
    </div>
    <div id="status">Status: Connecting to API...</div>
    <div id="inbox"></div>

    <script>
        let lastCookies = localStorage.getItem('temp_cookies') || "";
        let seenIds = new Set();

        async function fetchMail() {
            try {
                const res = await fetch('/api', {
                    headers: { 'x-temp-cookies': lastCookies }
                });
                const result = await res.json();
                
                if (result.cookies) {
                    lastCookies = result.cookies;
                    localStorage.setItem('temp_cookies', result.cookies);
                }

                if (result.data.mailbox) {
                    document.getElementById('mail').innerText = result.data.mailbox;
                }

                if (result.data.messages) {
                    result.data.messages.reverse().forEach(msg => {
                        const id = msg.id || msg.subject;
                        if (!seenIds.has(id)) {
                            seenIds.add(id);
                            showMsg(msg);
                        }
                    });
                }
                document.getElementById('status').innerText = "Status: Monitoring... " + new Date().toLocaleTimeString();
            } catch (e) {
                document.getElementById('status').innerText = "Error: API Down";
            }
        }

        function showMsg(msg) {
            const div = document.createElement('div');
            div.className = 'msg';
            const body = msg.content.replace(/<[^>]+>/g, ' ');
            const code = body.match(/\b(\d{4,8})\b/);
            div.innerHTML = `
                <b>From:</b> ${msg.from} <br>
                <b>Subject:</b> ${msg.subject} <br>
                <b>Text:</b> ${body.substring(0, 150)}... <br>
                ${code ? `<span class="otp">OTP: ${code[1]}</span>` : ''}
            `;
            document.getElementById('inbox').prepend(div);
        }

        setInterval(fetchMail, 6000); // Check every 6s
        fetchMail();
    </script>
</body>
</html>
